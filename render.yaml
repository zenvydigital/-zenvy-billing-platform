# Render blueprint for the Zenvy Billing Platform.
# Usage: push this repo to GitHub, then in Render: New + > Blueprint > connect the repo.
# DATABASE_URL is NOT defined here — set it in the Render dashboard from the Supabase
# project (see PLAN.md). JWT_SECRET is generated by Render on first deploy.
services:
  - type: web
    name: zenvy-billing-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://app.zenvydigitals.online
